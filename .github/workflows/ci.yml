name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # mínimo privilegio para el GITHUB_TOKEN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests
      - run: pytest --cov=obsproto --cov-report=term-missing

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cfn-lint
      - run: cfn-lint infra/template.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # gitleaks revisa todo el historial
      - name: Secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Auditoría de dependencias
        run: pip install pip-audit && pip-audit .
      - name: Escaneo de IaC y Dockerfile (Trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint del Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - run: docker build -t obsproto:ci .
      - name: Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: obsproto:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
