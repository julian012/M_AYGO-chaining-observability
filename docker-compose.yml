# Pila completa del prototipo. Endurecimiento aplicado a TODOS los servicios (ver docs/threat-model.md):
# usuario no root, FS de solo lectura, sin capabilities, sin escalado de privilegios, límites de recursos
# y red interna sin salida a Internet. Solo el gateway (TLS) y el correlacionador (solo loopback) publican puertos.
name: obsproto

x-hardened: &hardened
  build: .
  image: obsproto:0.1.0
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  tmpfs: ["/tmp:size=16m,noexec,nosuid"]

x-env-common: &env-common
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?ejecuta `make setup` para generar .env}

services:
  gateway:
    <<: *hardened
    command: ["python", "-m", "obsproto.gateway"]
    cpus: ${GATEWAY_CPUS:-0.5} # escalado vertical en las pruebas (0.5 por defecto, como el resto)
    environment:
      <<: *env-common
      API_KEYS: ${API_KEYS:?ejecuta `make setup` para generar .env}
      PORT: "8443"
      TLS: "1"
      LOG_FILE: /var/log/app/gateway.log
      BUS_URL: http://bus:8081
      RATE_PER_SEC: ${RATE_PER_SEC:-200}
      RATE_BURST: ${RATE_BURST:-400}
    ports: ["${GATEWAY_BIND:-127.0.0.1}:8443:8443"]
    volumes:
      - logs-gateway:/var/log/app
      - ./certs:/certs:ro
    networks: [edge, internal]
    healthcheck: &hc
      test: ["CMD", "python", "-m", "obsproto.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on: { bus: { condition: service_healthy } }

  bus:
    <<: *hardened
    command: ["python", "-m", "obsproto.bus"]
    environment:
      <<: *env-common
      PORT: "8081"
      LOG_FILE: /var/log/app/bus.log
      LOG_LEVEL: ${BUS_LOG_LEVEL:-DEBUG} # INFO = el par de IDs no queda en el log (escenario de ruptura)
      BUS_INFO_PROFILE: ${BUS_INFO_PROFILE:-split} # split: par solo en DEBUG · summary: una línea INFO por mensaje
      CORE_LINK: ${CORE_LINK:-frame} # frame: ID del bus en la trama · tracenumber: el core no lo recibe
      BUS_TRACE_LOG: ${BUS_TRACE_LOG:-clear} # clear | token | mask | none: cómo queda el tracenumber en el log
      BUS_TRACE_MASK_DIGITS: ${BUS_TRACE_MASK_DIGITS:-4}
      TRACE_TOKEN_KEY: ${TRACE_TOKEN_KEY:-}
      CORE_ADDR: core:9000 # tramas por socket TCP (cabecera de longitud de 4 dígitos), no HTTP
    volumes: ["logs-bus:/var/log/app"]
    networks: [internal]
    healthcheck: *hc
    depends_on: { core: { condition: service_healthy } }

  core:
    <<: *hardened
    command: ["python", "-m", "obsproto.core"]
    environment:
      <<: *env-common
      PORT: "9000" # servidor TCP de tramas
      HEALTH_MODE: tcp
      LOG_FILE: /var/log/app/core.log
      CORE_LINK: ${CORE_LINK:-frame}
      FAULT_RATE: ${FAULT_RATE:-0.0}
      LATENCY_MIN_MS: ${LATENCY_MIN_MS:-5}
      LATENCY_MAX_MS: ${LATENCY_MAX_MS:-40}
      BATCH_INTERVAL_S: ${BATCH_INTERVAL_S:-5} # cada cuánto sube el archivo plano de novedades
      FTP_HOST: ftp
      FTP_PORT: "2121"
      FTP_USER: novedades
      FTP_PASSWORD: ${FTP_PASSWORD:?ejecuta `make setup` para generar .env}
    volumes: ["logs-core:/var/log/app"]
    networks: [internal]
    healthcheck: *hc
    depends_on: { ftp: { condition: service_healthy } }

  modern:
    <<: *hardened
    command: ["python", "-m", "obsproto.modern"]
    environment:
      <<: *env-common
      PORT: "8083"
      LOG_FILE: /var/log/app/modern.log
      FTP_HOST: ftp
      FTP_PORT: "2121"
      FTP_USER: novedades
      FTP_PASSWORD: ${FTP_PASSWORD:?ejecuta `make setup` para generar .env}
      POLL_S: ${POLL_S:-2} # cada cuánto revisa el FTP
    volumes: ["logs-modern:/var/log/app"]
    networks: [internal]
    healthcheck: *hc
    depends_on: { ftp: { condition: service_healthy } }

  # Plataforma MFT (stand-in de un manejador de archivos): mueve los archivos planos de /outbox (core) a /inbox (moderno)
  # y deja un log de sesión y de archivo. Ver ADR-0008.
  mft:
    <<: *hardened
    command: ["python", "-m", "obsproto.mft"]
    environment:
      PORT: "8084"
      LOG_FILE: /var/log/app/mft.log
      FTP_HOST: ftp
      FTP_PORT: "2121"
      FTP_USER: novedades
      FTP_PASSWORD: ${FTP_PASSWORD:?ejecuta `make setup` para generar .env}
      MFT_POLL_S: ${MFT_POLL_S:-3}
      CORE_NODE: CORE01
    volumes: ["logs-mft:/var/log/app"]
    networks: [internal]
    healthcheck: *hc
    depends_on: { ftp: { condition: service_healthy } }

  # Transferencia de archivos planos core -> moderno. Stand-in FTP (stdlib), solo en la red interna:
  # FTP viaja en claro; en producción SFTP o FTPS (riesgo residual en docs/threat-model.md).
  ftp:
    <<: *hardened
    command: ["python", "-m", "obsproto.ftpserver"]
    environment:
      PORT: "2121"
      HEALTH_MODE: ftp
      FTP_ROOT: /srv/ftp
      FTP_USER: novedades
      FTP_PASSWORD: ${FTP_PASSWORD:?ejecuta `make setup` para generar .env}
    volumes: ["ftp-data:/srv/ftp"]
    networks: [internal]
    healthcheck: *hc

  correlator:
    <<: *hardened
    command: ["python", "-m", "obsproto.correlator.server"]
    mem_limit: ${CORRELATOR_MEM:-384m} # grafo lleno (200 000 eventos) ≈ 150 MB + intérprete; en AWS se midieron 190 MB con 256 MB de límite
    environment:
      CORRELATOR_TOKEN: ${CORRELATOR_TOKEN:?ejecuta `make setup` para generar .env}
      TRACE_TOKEN_KEY: ${TRACE_TOKEN_KEY:-} # para unir tracenumbers tokenizados (misma llave que el bus)
      TRACE_MATCH_WINDOW_S: ${TRACE_MATCH_WINDOW_S:-5} # ventana de la unión por máscara
      MFT_ENABLED: "1" # la traza completa incluye la transferencia MFT del archivo plano
      PORT: "9100"
      LOG_DIR: /logs
      MAX_EVENTS: ${MAX_EVENTS:-200000}
    ports: ["127.0.0.1:9100:9100"] # nunca expuesto fuera del host: usar túnel SSH
    volumes: # los logs se montan en SOLO LECTURA: el correlacionador no puede alterar la evidencia
      - logs-gateway:/logs/gateway:ro
      - logs-bus:/logs/bus:ro
      - logs-core:/logs/core:ro
      - logs-modern:/logs/modern:ro
      - logs-mft:/logs/mft:ro
    networks: [edge, internal]
    healthcheck: *hc

networks:
  edge: {}
  internal:
    internal: true # sin ruta a Internet

volumes:
  ftp-data: {}
  logs-gateway: {}
  logs-bus: {}
  logs-core: {}
  logs-modern: {}
  logs-mft: {}
