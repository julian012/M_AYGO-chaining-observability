[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsproto"
version = "0.1.0"
description = "Prototipo: correlación de trazas end-to-end entre sistemas heterogéneos mediante encadenamiento de IDs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # solo biblioteca estándar (ver docs/adr/0003-stdlib-minimal.md)

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "cfn-lint>=1.0", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # se mantienen typing.Dict/Optional por compatibilidad 3.9
    "SIM115",  # los handles de log son de larga vida a propósito
    "S310",  # urllib solo se usa con URLs internas fijas definidas por configuración
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
